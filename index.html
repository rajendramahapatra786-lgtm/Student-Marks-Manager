<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student Marks Manager</title>

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <!-- CSS -->
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/layout.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/form.css">
    <link rel="stylesheet" href="css/report.css">
    <link rel="stylesheet" href="css/animations.css">
    <link rel="stylesheet" href="css/responsive.css">

</head>

<body>

    <div class="main-wrapper">

        <div class="dashboard">

            <!-- ================= LEFT PANEL ================= -->

            <section class="left-panel">

                <div class="logo-area">

                    <div class="logo-box">

                        <img src="assets/images/logo.png" alt="Logo">

                    </div>

                    <div>

                        <h1>Student Marks Manager</h1>

                        <p>Create, Calculate & Manage Student Report Cards</p>

                    </div>

                </div>

                <div class="student-form">

                    <div class="section-title">

                        <i class="bi bi-person-vcard-fill"></i>

                        <h3>Student Information</h3>

                    </div>

                    <label>Student Name</label>

                    <div class="input-box">

                        <i class="bi bi-person-fill"></i>

                        <input id="name" type="text" placeholder="Enter Student Name">

                    </div>

                    <label>Roll Number</label>

                    <div class="input-box">

                        <i class="bi bi-credit-card-fill"></i>

                        <input id="roll" type="text" maxlength="12" placeholder="Enter Roll Number">

                    </div>

                    <label>Number of Subjects</label>

                    <div class="input-box">

                        <i class="bi bi-123"></i>

                        <input id="subjects" type="number" min="1" placeholder="Enter Subject Count">

                    </div>

                    <button class="add-btn" onclick="createInputs()">

                        <i class="bi bi-plus-circle-fill"></i>

                        Add Subject

                    </button>

                </div>

                <div class="subjects-card">

                    <div class="section-title">

                        <i class="bi bi-journal-bookmark-fill"></i>

                        <h3>Subjects & Marks</h3>

                    </div>

                    <div id="marksContainer">

                    </div>

                </div>

                <div class="button-group">

                    <button class="calculate-btn" onclick="calculateResult()">

                        <i class="bi bi-calculator-fill"></i>

                        Calculate Result

                    </button>

                    <button class="reset-btn" onclick="resetAll()">

                        <i class="bi bi-arrow-clockwise"></i>

                        Reset All

                    </button>

                </div>

            </section>


            <!-- ================= RIGHT PANEL ================= -->

            <section class="right-panel">

                <div class="dashboard-header">

                    <div>

                        <h2>Student Dashboard</h2>

                        <p>Academic Performance Summary</p>

                    </div>

                    <button id="downloadPdf" class="download-btn" onclick="downloadPDF()">

                        <i class="bi bi-download"></i>

                        Download PDF

                    </button>

                </div>

                <!-- Profile Card -->

                <div class="profile-card">

                    <div class="profile-left">

                        <div class="profile-avatar" id="studentAvatar">

                            RM

                        </div>

                        <div>

                            <h3 id="studentNameDisplay">

                                Student Name

                            </h3>

                            <span id="studentRollDisplay">

                                Roll Number

                            </span>

                        </div>

                    </div>

                    <div class="profile-right">

                        <img src="assets/images/books.png" alt="Trophy">

                    </div>

                </div>

               

                <!-- Subject Report -->

                <div class="report-card">

                    <div class="report-header">

                        <h3>

                            <i class="bi bi-journal-check"></i>

                            Subject Performance

                        </h3>

                    </div>

                    <div id="result">

                        <!-- JS Generates Report -->

                    </div>

                     <!-- Summary Cards -->

                <div class="summary-grid">

                    <div class="summary-card">

                        <i class="bi bi-clipboard-data-fill"></i>

                        <h2 id="totalMarks">

                            0

                        </h2>

                        <span>Total Marks</span>

                    </div>

                    <div class="summary-card">

                        <i class="bi bi-bar-chart-fill"></i>

                        <h2 id="percentage">

                            0%

                        </h2>

                        <span>Percentage</span>

                    </div>

                    <div class="summary-card">

                        <i class="bi bi-award-fill"></i>

                        <h2 id="grade">

                            -

                        </h2>

                        <span>Grade</span>

                    </div>

                    <div class="summary-card">

                        <i class="bi bi-check-circle-fill"></i>

                        <h2 id="status">

                            --

                        </h2>

                        <span>Status</span>

                    </div>

                </div>

                </div>

            </section>

        </div>

    </div>

    <!-- jsPDF -->

    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

    <!-- JavaScript -->

    <script src="js/app.js"></script>
    <script src="js/form.js"></script>
    <script src="js/report.js"></script>
    <script src="js/pdf.js"></script>
    <script src="js/speech.js"></script>
    <script src="js/validation.js"></script>
    <script src="js/ui.js"></script>

</body>

</html>
